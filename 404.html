.mbar.on{transform:none}.mbar .btn{min-height:52px;box-shadow:0 12px 26px -10px rgba(14,26,61,.5)}
.mbar .btn-ink{border:1px solid rgba(255,255,255,.18)}.mbar .btn-go{border:2px solid var(--ink)}.mbar .btn{padding:0 14px;letter-spacing:.05em;font-size:.84rem;gap:8px}
@media (max-width:720px){.mbar{display:grid}}
/* reveal */

.js [data-r].in{opacity:1;transform:none}
.hero-in .hi{opacity:0;transform:translateY(24px)}
.hero-in.go .hi{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
html.calm [data-r],html.calm .hang,html.calm .hi,html.calm .qw{opacity:1!important;transform:none!important}
